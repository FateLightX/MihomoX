name: stale-issues
# mihomox-actions-index: force workflow registration

on:
  schedule:
    - cron: "0 16 * * *"

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10
        with:
          stale-issue-message: 'This issue is stale because it has had no activity for 30 days. Remove the stale label or comment, otherwise it will be closed after 14 more days.'
          close-issue-message: 'This issue was closed because it had no activity for 14 days after being marked stale.'
          days-before-issue-stale: 30
          days-before-issue-close: 14
          days-before-pr-stale: -1
          days-before-pr-close: -1
